[package]
name = "leak"
version = "0.2.1"
description = "Leak - personal finance tracker"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "leak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"

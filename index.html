<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161513" />
    <title>Leak</title>
    <!-- The last light/dark choice (App.tsx saves it), painted before the app loads so the window never opens white. -->
    <style>
      html { background: #ebe7de; }
      html.dark { background: #0f0e0d; }
    </style>
    <script>
      try {
        var look = JSON.parse(localStorage.getItem('leak-look') || '{}')
        if (look.theme === 'dark' || (look.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
